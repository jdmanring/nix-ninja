[workspace]
resolver = "2"
# vendor-n2 is a member so the gate reaches it. It is a path dependency that
# every build.ninja in every consumer is parsed by, and until 2026-08-30 it sat
# outside BOTH gates: `cargo clippy --all-targets -- --deny warnings` never
# linted it, and its 41 e2e tests never ran, in the workspace or in nextest.
# Its files were already inside nix-ninja-task's fileset, so they were in the
# derivation key while being covered by nothing.
# Its own [profile.release] was already ignored as a non-root package; making
# it a member changes nothing there beyond silencing the warning that said so.
members = ["crates/*", "vendor-n2"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.metadata.crane]
name = "nix-ninja"

[workspace.dependencies]
harmonia-protocol = { git = "https://github.com/nix-community/harmonia.git", branch = "main" }
harmonia-store-aterm = { git = "https://github.com/nix-community/harmonia.git", branch = "main" }
harmonia-store-content-address = { git = "https://github.com/nix-community/harmonia.git", branch = "main" }
harmonia-store-derivation = { git = "https://github.com/nix-community/harmonia.git", branch = "main" }
harmonia-store-path = { git = "https://github.com/nix-community/harmonia.git", branch = "main" }
harmonia-store-remote = { git = "https://github.com/nix-community/harmonia.git", branch = "main" }
harmonia-utils-hash = { git = "https://github.com/nix-community/harmonia.git", branch = "main" }
