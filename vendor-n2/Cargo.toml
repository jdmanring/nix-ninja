[package]
name = "n2"
version = "0.1.0"
categories = ["development-tools", "development-tools::build-utils"]
edition = "2021"
exclude = [".github/*", ".vscode/*"]
homepage = "https://github.com/evmar/n2"
keywords = ["ninja", "build"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/evmar/n2"
# https://github.com/evmar/n2/issues/74
# Note: if we bump this, may need to bump .github/workflows/ci.yml version too.
rust-version = "1.81.0"
description = "a ninja compatible build system"

[dependencies]
anyhow = "1.0"
lexopt = "0.3.0"
libc = "0.2"
rustc-hash = "1.1.0"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.48"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Pipes",
  "Win32_System_Threading",
]

[target.'cfg(not(any(windows, target_arch = "wasm32")))'.dependencies]
jemallocator = { version = "0.5", optional = true }

[dev-dependencies]
divan = "0.1.16"
tempfile = "3.6.0"

[profile.release]
debug = true
lto = true

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "canon"
harness = false

[features]
# jemalloc default removed in this vendored copy: n2 is consumed here
# as a parser library, and jemalloc-sys does not build in this env.
default = []
jemalloc = ["jemallocator"]
crlf = []

# n2 is VENDORED UPSTREAM (evmar's n2, via the hinshun fork), and the
# workspace's `clippy -- --deny warnings` was being applied to it: 44 style
# and complexity lints in code we did not write, which made `nix flake check`
# permanently red and buried anything real underneath.
#
# Style and complexity are allowed here; correctness, suspicious and perf are
# NOT, because those are the categories that catch a defect rather than a
# preference. That distinction is load-bearing rather than tidy: with `all`
# allowed, the `clippy::uninit_vec` in `read_file_with_nul` - a genuine
# undefined-behaviour bug, since `set_len` on reserved-but-uninitialised
# memory handed uninit bytes to safe code - would have been silenced instead
# of found and fixed.
[lints.clippy]
style = { level = "allow", priority = -1 }
complexity = { level = "allow", priority = -1 }
perf = { level = "allow", priority = -1 }
suspicious = { level = "allow", priority = -1 }

# `correctness` is deliberately absent from that list and must stay absent.
# It is the category holding `uninit_vec`, the undefined behaviour actually
# found in this crate, so it is the one earning its keep.
[lints.rust]
dead_code = "allow"
# rustc lints, not clippy ones, so [lints.clippy] above does not reach them.
mismatched_lifetime_syntaxes = "allow"

