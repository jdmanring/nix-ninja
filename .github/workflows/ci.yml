name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, reopened, labeled, synchronize ]
  # So a run can be started without a push.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Cache Rust Artifacts
        uses: actions/cache@v4
        env:
          cache-name: cache-rust-artifacts
        with:
          path: |
            /home/runner/.cargo
            target
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '**/.cargo/config.toml', '**/rust-toolchain.toml', '**/flake.nix', '**/flake.lock') }}
      - name: Build
        run: |
          eval "$(nix print-dev-env)"

          set -x
          cargo fmt --check
          cargo clippy
          cargo test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Run nix flake check
        run: nix flake check -L

  gates:
    runs-on: ubuntu-latest
    steps:
      # FULL HISTORY, and it is load-bearing: `duplicate-predicate-sweep.sh`
      # rebuilds its control from an older revision, and a shallow checkout
      # (the action's default) cannot read that commit, so the gate reports
      # NO ANSWER instead of a verdict. Measured on the first run of this job.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # NO NIX AND NO SETUP: these gates are the ones that run against a clone
      # with nothing installed, which is the property that makes them worth
      # publishing. A job that needed the daemon would be testing a different
      # claim.
      - name: Run the published gates
        run: |
          fail=0
          # EACH GATE IS MATCHED ON ITS VERDICT TEXT, NOT ON ITS EXIT CODE, and
          # the reason is `duplicate-predicate-sweep.sh`: it exits 1 by design,
          # because its pairs are a candidate set to read rather than a tree
          # failure, so scoring it on status would make every build red for a
          # documented result. Matching the text also fails the job when a
          # gate's verdict changes without its caller being updated.
          #
          # THREE GATES, NOT FOUR. `daemon-gap-cpu-probe.sh` is a diagnostic
          # tool that samples live nix-daemon workers and prints no verdict, so
          # there is nothing to assert on and a runner with no daemon would
          # make a pattern match the wrong line. It is published because it is
          # useful to run by hand, not because CI can judge it.
          check() {  # check <script> <expected verdict regex>
            printf '%-44s ' "$1"
            out=$(bash "gates/$1" 2>&1)
            if printf '%s' "$out" | grep -Eq "$2"; then
              printf '%s' "$out" | grep -oE "$2" | head -1
            else
              echo "VERDICT NOT PRINTED: $(printf '%s' "$out" | tail -1 | cut -c1-58)"
              fail=1
            fi
          }
          check stdout-contract-sweep.sh              '^PASS: no stdout diagnostic added'
          check cmake-byproducts-target-expression.sh '^PASS: OUTPUT and BYPRODUCTS refuse'
          check duplicate-predicate-sweep.sh          '^(FAIL: [0-9]+ pair|PASS: no)'
          exit $fail

  integration-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per registered nixosTest. The lint job's `nix flake check`
        # runs all of these too; this job exists so a failure names the test
        # rather than the check set, and so it can run them in parallel.
        test:
          - nix-build-hello
          - nix-build-header
          - nix-build-multi-source
          - nix-build-shared-lib
          - nix-build-run-script
          - nix-build-dynamic-deps
          - nix-build-generated-header
          - nix-build-cmake-order-only-header
          - nix-build-fortran-module-recursive
          - nix-build-dotdot-source-include
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
      - name: Build NixOS test driver
        run: nix build -L .#driver-${{ matrix.test }}
      - name: Run integration tests
        run: nix run -L .#test-${{ matrix.test }}
