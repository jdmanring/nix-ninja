[package]
name = "nix-ninja"
version.workspace = true
edition.workspace = true
description = "Ninja compatible build system using Nix backend"
license = "MIT"

[dependencies]
rustc-hash = "1.1.0"
anyhow = { version = "1.0", features = ["backtrace"] }
clap = { version = "4.4", features = ["derive", "env"] }
deps-infer = { path = "../deps-infer" }
harmonia-store-content-address = { workspace = true }
harmonia-store-derivation = { workspace = true }
harmonia-store-path = { workspace = true }
harmonia-utils-hash = { workspace = true }
# Already in the lock as a transitive dependency; named here for
# mallinfo2, the only route to the allocator's own counters.
libc = "0.2"
include-graph = { git = "https://github.com/hinshun/igraph", branch = "performance-improvements" }
n2 = { path = "../../vendor-n2", default-features = false }
nix-builder-rpc-client = { path = "../nix-builder-rpc-client" }
nix-ninja-task = { path = "../nix-ninja-task" }
regex = "1"
serde = "1"
serde_json = "1"
sha2 = "0.10"
shell-words = "1.1.0"
walkdir = "2"
which = "7.0.2"

[dev-dependencies]
# Already in the lock via vendor-n2's own benches, so this adds no new
# dependency to the tree - see upstream #4.
#
# DEFER(a `cargo update` bumps divan, or the benches move to their own crate
# outside the workspace): a dev-dependency of the DRIVER still writes a line
# into Cargo.lock, and Cargo.lock is inside nix-ninja-task's fileset
# allowlist. So a version bump to a benchmark that never runs inside a build
# would re-key every banked per-TU output. Harmless in the batch that
# introduced it, because patchelf.rs and vendor-n2 re-keyed the task binary
# anyway, but it is a standing hazard rather than a spent one.
divan = "0.1.16"
# for the #41 mmap comparison; already a dependency of this crate.
libc = "0.2"

[[bench]]
name = "generate"
harness = false
