[package]
name = "deps-infer"
version.workspace = true
edition.workspace = true
description = "Dependency inference for C/C++"
license = "MIT"

[dependencies]
anyhow = "1.0"
clang-sys = { version = "1.8", optional = true }
clap = { version = "4.5", features = ["derive"] }
n2 = { git = "https://github.com/hinshun/n2", branch = "feature/minimal-pub", default-features = false }
regex = "1"
shell-words = "1.1.0"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3.18", features = [
  "json",
  "matchers",
  "time",
  "tracing",
  "env-filter",
  "regex",
] }

[features]
# Off by default: clang-sys links libclang at runtime, and the driver runs
# inside every task derivation, so an unconditional dependency puts libclang
# in the closure of builds that use gcc and never touch clang.
clang = ["dep:clang-sys"]
